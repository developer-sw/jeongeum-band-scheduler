# Apply AFTER compose.production.yaml. Requires Compose >= 2.24.4 (!override).
# Values stay identical; the PG init and Backend receive different owner-only files.
# The helper must prepare/check the Linux files before any service is started.
services:
  postgres:
    secrets: !override
      - source: postgres_admin_password
        target: postgres_admin_password
      - source: postgres_app_db_password
        target: app_db_password

secrets:
  postgres_app_db_password:
    file: ${POSTGRES_APP_DB_PASSWORD_FILE:?Set the PostgreSQL-owned app password copy}

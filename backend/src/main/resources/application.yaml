spring:
  application:
    name: jeongeum-band-scheduler
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 90d

server:
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax
        max-age: ${spring.session.timeout}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

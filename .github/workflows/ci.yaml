name: CI

on:
  push:
    branches: [main, 'codex/**', 'chore/**', 'feature/**', 'fix/**']
    paths: ['backend/**', 'frontend/**', 'deploy/**', 'scripts/Test-ProductionContainers.ps1', 'scripts/production-container-qa.mjs', 'scripts/production-qa-result-export.test.ps1', 'scripts/production-image-release.mjs', 'scripts/production-image-release.test.mjs', 'scripts/production-backup*.py', 'scripts/configuration-backup*.py', 'scripts/backup-source-readiness*.py', '.node-version', '.github/workflows/ci.yaml', '.github/workflows/release-images.yaml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'deploy/**', 'scripts/Test-ProductionContainers.ps1', 'scripts/production-container-qa.mjs', 'scripts/production-qa-result-export.test.ps1', 'scripts/production-image-release.mjs', 'scripts/production-image-release.test.mjs', 'scripts/production-backup*.py', 'scripts/configuration-backup*.py', 'scripts/backup-source-readiness*.py', '.node-version', '.github/workflows/ci.yaml', '.github/workflows/release-images.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  operations-backup:
    name: Synthetic backup and recovery guard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify encrypted backup contract with fake Docker and AWS
        run: python3 -I -B scripts/production-backup.test.py
      - name: Verify settings archive authentication and path boundaries
        run: python3 -I -B scripts/configuration-backup.test.py
      - name: Verify existing synthetic source start and readiness guards
        run: python3 -I -B scripts/backup-source-readiness.test.py

  backend:
    name: Backend test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle.kts
            backend/gradle.lockfile
            backend/gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew --no-daemon test bootJar

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  production-containers:
    name: Production containers with synthetic database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build and verify isolated HTTPS stack
        shell: pwsh
        run: ./scripts/Test-ProductionContainers.ps1

  production-image-release-contract:
    name: Production image release contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test scripts/production-image-release.test.mjs
      - name: Verify private QA result export boundaries without Docker
        shell: pwsh
        run: pwsh -NoProfile -File scripts/production-qa-result-export.test.ps1

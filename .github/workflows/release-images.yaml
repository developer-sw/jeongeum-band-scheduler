name: Production image release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version: vMAJOR.MINOR.PATCH (validated by the release helper)'
        required: true
        type: string
      visibility:
        description: 'Expected GHCR visibility; choose public only with explicit approval'
        required: true
        type: choice
        default: private
        options:
          - private
          - public
      publish:
        description: 'Publish the verified images to GHCR; this does not deploy a server'
        required: true
        type: boolean
        default: false

permissions: {}

# Serialize every version in this repository, including manual reruns.
concurrency:
  group: production-image-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare and verify production images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the original repository and a manual main run
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REPOSITORY" != "developer-sw/jeongeum-band-scheduler" ]]; then
            printf '%s\n' 'Production image preparation requires a manual main run in the original repository.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build once, verify the exact main CI and run synthetic QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_VISIBILITY: ${{ inputs.visibility }}
        run: node scripts/production-image-release.mjs prepare --version "$RELEASE_VERSION" --directory release-artifacts --visibility "$RELEASE_VISIBILITY"
      - name: Upload only the verified image candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Keep this name stable when only a failed publish job is rerun.
          # A full prepare rerun cannot replace the immutable original artifact.
          name: production-image-candidate-${{ github.run_id }}-${{ github.sha }}
          path: |
            release-artifacts/images.tar
            release-artifacts/candidate.json
            release-artifacts/qa-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          include-hidden-files: false
          overwrite: false

  publish:
    name: Publish verified production image digests
    needs: prepare
    if: ${{ inputs.publish && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Require the original repository and a manual main run
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REPOSITORY" != "developer-sw/jeongeum-band-scheduler" ]]; then
            printf '%s\n' 'Production image publication requires a manual main run in the original repository.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download only this run's verified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-image-candidate-${{ github.run_id }}-${{ github.sha }}
          path: release-artifacts
          digest-mismatch: error
      - name: Verify registry pulls and promote the version tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_VISIBILITY: ${{ inputs.visibility }}
        run: node scripts/production-image-release.mjs publish --version "$RELEASE_VERSION" --directory release-artifacts --visibility "$RELEASE_VISIBILITY"
      - name: Upload only the final digest references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            release-artifacts/release.json
            release-artifacts/release.env
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
